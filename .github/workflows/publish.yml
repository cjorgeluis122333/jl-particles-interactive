name: Publish to npm + GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/jl-particle-interactive/**'
      - 'package-lock.json'
      - '.github/workflows/publish.yml'

permissions:
  contents: write  # needed to create tags and GitHub Releases

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to check existing tags

      - name: Read version from the library package
        id: pkg
        run: |
          VERSION="$(node -p "require('./packages/jl-particle-interactive/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version tag already exists
        id: tag_check
        run: |
          if git tag -l "v${{ steps.pkg.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.tag_check.outputs.exists == 'false'
        run: npm ci

      - name: Type-check (lint)
        if: steps.tag_check.outputs.exists == 'false'
        run: npm run lint --workspace=jl-particle-interactive

      - name: Build library
        if: steps.tag_check.outputs.exists == 'false'
        run: npm run build --workspace=jl-particle-interactive

      - name: Publish to npm
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          npm publish --workspace=jl-particle-interactive --access public

      - name: Create git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.pkg.outputs.version }}
          git push origin v${{ steps.pkg.outputs.version }}

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          body: |
            ## jl-particle-interactive v${{ steps.pkg.outputs.version }}

            Install or upgrade:
            ```
            npm install jl-particle-interactive@${{ steps.pkg.outputs.version }}
            ```
          draft: false
          prerelease: false
